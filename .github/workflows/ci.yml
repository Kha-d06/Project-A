name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Signing keys live only offline or in the secret store; never in the repository.
  no-private-keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: python3 scripts/check-no-private-keys.py

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinel
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U sentinel" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install -e '.[dev]' pip-audit
      - run: ruff check . && ruff format --check .
      - run: mypy app
      - run: pytest -q
      - name: qalaa-scan model and bundle tools
        run: pytest -q -p no:cacheprovider ../../tools/scan-model ../../tools/scan-bundle
      - name: Migrations apply cleanly and match the models
        env:
          SENTINEL_DATABASE_URL: postgresql+psycopg://sentinel:sentinel@localhost:5432/sentinel
        run: alembic upgrade head && alembic check
      - name: Dependency vulnerability scan
        run: pip-audit --skip-editable

  # The parser jail inside real nsjail (new network, user, PID, IPC and mount
  # namespaces). The seccomp + Landlock layer is tested in the api job above.
  sandbox-nsjail:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Build nsjail 3.4
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q autoconf bison flex gcc g++ libprotobuf-dev libnl-route-3-dev libtool make pkg-config protobuf-compiler
          git clone --depth 1 --branch 3.4 https://github.com/google/nsjail.git
          # Newer compilers add warnings that nsjail's -Werror turns into build failures.
          sed -i 's/-Werror//' nsjail/Makefile
          make -C nsjail -j"$(nproc)"
          sudo install -m 0755 nsjail/nsjail /usr/local/bin/nsjail
      - name: Allow unprivileged user namespaces (Ubuntu restricts them through AppArmor)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pip install -e '.[dev]'
      - name: Inspection inside nsjail
        env:
          QALAA_TEST_NSJAIL: "1"
        run: pytest -q tests/test_sandbox.py

  # Atomic Red Team style regression tests: each atomic does what an attacker
  # would (read SSH keys, browser stores, open a listener) and the real
  # background service must report it over qalaa-ipc. Linux runs in a container
  # with no network at all; Windows and macOS on fresh GitHub-hosted runners.
  sandbox-gvisor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: gVisor runsc (release 20261102, checked against its SHA-512)
        run: |
          base=https://storage.googleapis.com/gvisor/releases/release/20261102/x86_64
          curl -sSfO "$base/gvisor.tar.bz2" && curl -sSfO "$base/gvisor.tar.bz2.sha512"
          echo "2e6671bb2d033b871c5811ab57e16ac570988b0e0054c525f911cfaf191bab3ca4efb08e0a98daa4b9e7d248f9e5776ef2ef2f8a6b82d829646a42924c98bb05  gvisor.tar.bz2" | sha512sum -c
          mkdir -p "$RUNNER_TEMP/gvisor" && tar -xjf gvisor.tar.bz2 -C "$RUNNER_TEMP/gvisor"
      - run: pip install -e '.[dev]'
      - name: A dropper-shaped script runs in gVisor with no network and a fake DNS/HTTP sink
        run: sudo env "PATH=$PATH" QALAA_TEST_RUNSC="$RUNNER_TEMP/gvisor/runsc" python -m pytest -q tests/test_detonation.py

  attack-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Runner unit tests
        run: pip install pyyaml pytest && cd tests/attack && pytest -q -p no:cacheprovider test_runner.py
      - name: Build the background service
        working-directory: apps/desktop
        run: npm ci && npm run build
      - name: Atomics in a --network none container
        run: |
          docker build -t qalaa-atomics tests/attack
          mkdir -p "$RUNNER_TEMP/atomics" && chmod 777 "$RUNNER_TEMP/atomics"
          docker run --rm --network none -v "$PWD:/repo:ro" -v "$RUNNER_TEMP/atomics:/out" \
            -e GITHUB_STEP_SUMMARY=/out/summary.md qalaa-atomics python3 tests/attack/run_atomics.py
      - name: Process-start helper as root (netlink process connector sees a millisecond command)
        working-directory: apps/desktop
        run: sudo env "PATH=$PATH" npx vitest run test/proc-connector.test.ts
      - name: Summary
        if: always()
        run: cat "$RUNNER_TEMP/atomics/summary.md" >> "$GITHUB_STEP_SUMMARY" || true

  attack-desktop-os:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install pyyaml
      - name: Build the background service
        working-directory: apps/desktop
        run: npm ci && npm run build
      - name: Atomics on a fresh runner
        run: python tests/attack/run_atomics.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint -- --max-warnings 0
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency vulnerability scan
        run: npm audit --omit=dev --audit-level=high

  desktop-native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop-native
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: System libraries for Slint (fonts, keyboard, windowing)
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop-native/target
          key: desktop-native-${{ runner.os }}-${{ hashFiles('apps/desktop-native/Cargo.lock') }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Guardian pet stays under 30 MB and 1% CPU when idle
        run: |
          sudo apt-get install -y xvfb
          cargo build --release --locked -p qalaa-guardian-pet
          xvfb-run -a -s "-screen 0 1280x720x24" scripts/pet-budget.sh 20

  desktop-native-compile:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop-native
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop-native/target
          key: desktop-native-${{ runner.os }}-${{ hashFiles('apps/desktop-native/Cargo.lock') }}
      - run: cargo build --locked --workspace

  thunderbird:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/thunderbird
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm test
      - run: npm run pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qalaa-thunderbird
          path: apps/thunderbird/dist/*.xpi

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/extension
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:firefox
      - name: Browser test of pre-load blocking and the on-screen assistant
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          SENTINEL_TEST_BUILD=1 SENTINEL_SERVER=http://localhost:8787 npm run build
          node test/e2e-assistant.mjs
      - name: Browser test of fingerprint noise
        run: node test/e2e-fingerprint.mjs
      - name: Browser test of the EasyList / EasyPrivacy rulesets compiled at build time
        run: |
          test -s dist/chrome/rules/easylist.json && test -s dist/chrome/rules/easyprivacy.json
          node test/e2e-adblock.mjs

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: End-to-end test in Electron
        run: |
          npm install --no-save playwright@1.63.0
          sudo apt-get update && sudo apt-get install -y xvfb zsh
          xvfb-run -a node test/e2e.mjs
      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high
      - name: Package for Linux (AppImage and .deb)
        run: npx electron-builder --linux AppImage deb --publish never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qalaa-desktop-linux
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb

  # Builds and starts the real Compose stack (Caddy, web, API, scan worker,
  # task worker, scheduler, PostgreSQL, Redis) and checks it end to end,
  # including the browser extension against it.
  stack:
    runs-on: ubuntu-latest
    needs: [api, web, extension]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Start the stack
        run: ./scripts/up.sh --fixtures
      - name: Scan through Caddy and the isolated scan worker
        run: |
          id=$(curl -fsS -X POST http://localhost:8080/api/v1/scans/url \
            -H 'content-type: application/json' \
            -d '{"url":"http://malware.example.net/payload.exe"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          for _ in $(seq 1 30); do
            status=$(curl -fsS "http://localhost:8080/api/v1/scans/$id" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
            [ "$status" = completed ] || [ "$status" = inconclusive ] && break
            sleep 2
          done
          curl -fsS "http://localhost:8080/api/v1/scans/$id" | python3 -c 'import json,sys; s=json.load(sys.stdin); print(s["status"], s["risk"]); assert s["risk"] == "known_malicious"'
      - name: The scan worker cannot read accounts
        run: |
          set -a; . ./.env; set +a
          ! docker compose exec -T postgres psql "postgresql://sentinel_worker:${WORKER_DB_PASSWORD}@localhost/sentinel" -c 'select count(*) from users'
          docker compose exec -T worker sh -c 'env | grep -q "^SENTINEL_DATABASE_URL=postgresql+psycopg://sentinel_worker:"'
      - name: VPN sync script
        run: sh infrastructure/vpn/test/sync-test.sh
      - name: VPN end to end (WireGuard server, a real handshake from the runner)
        run: |
          sudo apt-get update && sudo apt-get install -y wireguard-tools
          sed -i 's|^SENTINEL_VPN_ENDPOINT=.*|SENTINEL_VPN_ENDPOINT=127.0.0.1:51820|' .env
          docker compose --profile vpn up -d --build api vpn
          python3 infrastructure/vpn/test/stack-test.py http://localhost:8080
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Extension end to end against the stack
        working-directory: apps/extension
        run: |
          npm ci
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          SENTINEL_SERVER=http://localhost:8080 npm run build
          SENTINEL_SERVER=http://localhost:8080 node test/e2e.mjs
      - name: Password autofill end to end (vault on the site, fill from the extension)
        working-directory: apps/extension
        run: |
          SENTINEL_TEST_BUILD=1 SENTINEL_SERVER=http://localhost:8080 npm run build
          SENTINEL_SERVER=http://localhost:8080 node test/e2e-autofill.mjs
      - name: Accessibility audit (axe-core, WCAG 2.1 AA, English and Arabic, light and dark)
        working-directory: apps/web
        run: |
          npm ci
          npm install --no-save playwright@1.63.0
          SITE=http://localhost:8080 node test/a11y.mjs
      - name: Logs on failure
        if: failure()
        run: docker compose --profile vpn logs --tail=200

  # The Android Trusted Web Activity. GitHub's Ubuntu runners include the Android SDK.
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: "8.10.2"
      - name: Scanner unit tests (app risk, device checks, files, account protocol)
        run: gradle :scanner-core:test
      - run: gradle assembleDebug -PsiteHost=qalaa.example.org
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sentinel-android-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk

