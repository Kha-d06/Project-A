name: Reproducible builds

# Builds the same commit twice, from two separate checkouts with separate caches,
# and fails if any output differs by a single byte (docs/reproducible-builds.md).
# No signing key is involved: signatures are added later, offline, and are not
# part of what is compared.

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: a
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: b
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Exact version: a different Node or npm can bundle differently.
          node-version: "22.23.5"
      - name: Both checkouts are this commit
        run: |
          test "$(git -C a rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C b rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Filter lists, downloaded once so both builds get the same input
        run: |
          mkdir lists
          curl -fsSL https://easylist.to/easylist/easylist.txt -o lists/easylist.txt
          curl -fsSL https://easylist.to/easylist/easyprivacy.txt -o lists/easyprivacy.txt
          sha256sum lists/*
      - name: Build A
        run: npm_config_cache="$RUNNER_TEMP/npm-a" FILTER_LIST_DIR="$PWD/lists" a/scripts/reproducibility/build-all.sh a out-a js
      - name: Build B
        run: npm_config_cache="$RUNNER_TEMP/npm-b" FILTER_LIST_DIR="$PWD/lists" b/scripts/reproducibility/build-all.sh b out-b js
      - name: Compare
        run: python3 a/scripts/reproducibility/compare.py out-a out-b --report report-javascript.md
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reproducibility-javascript
          path: report-javascript.md

  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: a
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: b
      - name: Both checkouts are this commit
        run: |
          test "$(git -C a rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C b rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Toolchain (pinned in apps/desktop-native/rust-toolchain.toml)
        run: cd a/apps/desktop-native && rustc --version && cargo --version
      - name: Build A
        run: a/scripts/reproducibility/build-all.sh a out-a rust
      - name: Build B
        run: b/scripts/reproducibility/build-all.sh b out-b rust
      - name: Compare
        run: python3 a/scripts/reproducibility/compare.py out-a out-b --report report-native.md
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reproducibility-native
          path: report-native.md
