[workspace]
resolver = "2"
members = ["crates/qalaa-ipc", "crates/qalaa-command", "crates/qalaa-guardian-pet"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "renderer-femtovg", "accessibility"] }
slint-build = "=1.18.1"
i-slint-backend-testing = "=1.18.1"

[workspace.lints.clippy]
unwrap_used = "warn"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
