[package]
name = "qalaa-guardian-pet"
description = "Qalaa Guardian: a native, click-through desktop mascot (Slint)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "qalaa-guardian-pet"
path = "src/main.rs"

[dependencies]
qalaa-ipc = { path = "../qalaa-ipc" }
serde_json.workspace = true
slint = { workspace = true, features = ["unstable-winit-030"] }

[build-dependencies]
slint-build.workspace = true

[dev-dependencies]
i-slint-backend-testing.workspace = true
i-slint-core = "=1.18.1"

[lints]
workspace = true
