<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Qalaa Protect</title>
  <link rel="stylesheet" href="ui.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="popup stack" aria-live="polite">
    <header class="row spread">
      <span class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 29V5h3v2h2V5h3v6h2v2h2v-2h2v2h2v-2h2V5h3v2h2V5h3v24H3Z" fill="currentColor"/><path d="M13 29v-6.5a3 3 0 0 1 6 0V29h-6Z" fill="var(--canvas)"/><path d="m16 15.4 2 2-2 2-2-2 2-2Z" fill="var(--accent)"/></svg> Qalaa</span>
      <label class="row toggle" title="Pause or resume protection" data-i18n-title="popup.protectionToggle">
        <span id="state-label" class="faint" data-i18n="popup.protection">Protection</span>
        <input id="protection" class="switch" type="checkbox" role="switch" aria-label="Protection on" data-i18n-aria-label="popup.protectionOn" />
      </label>
    </header>
    <section id="page" class="stack"></section>
    <section id="setup" class="panel stack" hidden></section>
    <p id="preloaded" class="faint" hidden></p>
    <section id="vault" class="panel stack" hidden></section>
    <section class="stack">
      <div class="row spread">
        <h2 class="section-title" data-i18n="popup.recentAlerts">Recent alerts</h2>
        <button id="clear-alerts" class="ghost" type="button" hidden data-i18n="popup.clear">Clear</button>
      </div>
      <ul id="alerts" class="alerts"></ul>
    </section>
    <footer class="row spread">
      <a id="dashboard" href="#" target="_blank" rel="noopener" data-i18n="popup.openDashboard">Open dashboard</a>
      <a id="options" href="#" data-i18n="popup.settings">Settings</a>
    </footer>
  </main>
  <script src="popup.js" type="module"></script>
</body>
</html>
