# Local development and single-host deployment.
#
#   cp .env.example .env        # then set SENTINEL_SECRET_KEY and POSTGRES_PASSWORD
#   docker compose up --build
#   docker compose --profile clamav up --build   # also run ClamAV (about 1 GB of RAM)
#
# Caddy is the only published service: http://localhost:8080, or HTTPS on your
# domain when SENTINEL_SITE_ADDRESS is set. Every other container is internal.

x-api-environment: &api-environment
  SENTINEL_ENVIRONMENT: ${SENTINEL_ENVIRONMENT:-development}
  SENTINEL_SECRET_KEY: ${SENTINEL_SECRET_KEY:?Set SENTINEL_SECRET_KEY in .env}
  SENTINEL_DATABASE_URL: postgresql+psycopg://sentinel:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/sentinel
  SENTINEL_REDIS_URL: redis://redis:6379/0
  SENTINEL_SESSION_COOKIE_SECURE: ${SENTINEL_SESSION_COOKIE_SECURE:-false}
  SENTINEL_TRUST_FORWARDED_FOR: "true"
  SENTINEL_URLHAUS_AUTH_KEY: ${SENTINEL_URLHAUS_AUTH_KEY:-}
  SENTINEL_CLAMAV_HOST: ${SENTINEL_CLAMAV_HOST:-}
  SENTINEL_MOBSF_URL: ${SENTINEL_MOBSF_URL:-}
  SENTINEL_MOBSF_API_KEY: ${SENTINEL_MOBSF_API_KEY:-}
  SENTINEL_OPENAI_API_KEY: ${SENTINEL_OPENAI_API_KEY:-}
  SENTINEL_OPENAI_MODEL: ${SENTINEL_OPENAI_MODEL:-}
  SENTINEL_WEB_RISK_API_KEY: ${SENTINEL_WEB_RISK_API_KEY:-}
  SENTINEL_VIRUSTOTAL_API_KEY: ${SENTINEL_VIRUSTOTAL_API_KEY:-}
  SENTINEL_BROWSER_RENDERING: ${SENTINEL_BROWSER_RENDERING:-false}
  SENTINEL_HIBP_API_KEY: ${SENTINEL_HIBP_API_KEY:-}
  SENTINEL_VAPID_PUBLIC_KEY: ${SENTINEL_VAPID_PUBLIC_KEY:-}
  SENTINEL_VAPID_PRIVATE_KEY: ${SENTINEL_VAPID_PRIVATE_KEY:-}
  SENTINEL_VAPID_SUBJECT: ${SENTINEL_VAPID_SUBJECT:-mailto:security@localhost}
  SENTINEL_TELEGRAM_BOT_TOKEN: ${SENTINEL_TELEGRAM_BOT_TOKEN:-}
  SENTINEL_TELEGRAM_WEBHOOK_SECRET: ${SENTINEL_TELEGRAM_WEBHOOK_SECRET:-}
  SENTINEL_WHATSAPP_ACCESS_TOKEN: ${SENTINEL_WHATSAPP_ACCESS_TOKEN:-}
  SENTINEL_WHATSAPP_PHONE_NUMBER_ID: ${SENTINEL_WHATSAPP_PHONE_NUMBER_ID:-}
  SENTINEL_WHATSAPP_VERIFY_TOKEN: ${SENTINEL_WHATSAPP_VERIFY_TOKEN:-}
  SENTINEL_WHATSAPP_APP_SECRET: ${SENTINEL_WHATSAPP_APP_SECRET:-}
  SENTINEL_INBOUND_EMAIL_TOKEN: ${SENTINEL_INBOUND_EMAIL_TOKEN:-}
  SENTINEL_INBOUND_EMAIL_ADDRESS: ${SENTINEL_INBOUND_EMAIL_ADDRESS:-}
  SENTINEL_YARA_RULES_DIR: ${SENTINEL_YARA_RULES_DIR:-}
  SENTINEL_METRICS_TOKEN: ${SENTINEL_METRICS_TOKEN:-}
  SENTINEL_EMAIL_BACKEND: ${SENTINEL_EMAIL_BACKEND:-disabled}
  SENTINEL_EMAIL_FROM: ${SENTINEL_EMAIL_FROM:-SENTINEL <no-reply@localhost>}
  SENTINEL_SMTP_HOST: ${SENTINEL_SMTP_HOST:-}
  SENTINEL_SMTP_PORT: ${SENTINEL_SMTP_PORT:-587}
  SENTINEL_SMTP_USERNAME: ${SENTINEL_SMTP_USERNAME:-}
  SENTINEL_SMTP_PASSWORD: ${SENTINEL_SMTP_PASSWORD:-}
  SENTINEL_PUBLIC_URL: ${SENTINEL_PUBLIC_URL:-http://localhost:8080}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sentinel
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  migrate:
    build:
      context: ./services/api
      args:
        WITH_BROWSER: ${SENTINEL_WITH_BROWSER:-false}
    command: ["alembic", "upgrade", "head"]
    environment: *api-environment
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # Creates the restricted database role the scan worker uses.
  worker-role:
    image: postgres:16-alpine
    command:
      - sh
      - -c
      - psql "postgresql://sentinel:$$POSTGRES_PASSWORD@postgres:5432/sentinel" -v ON_ERROR_STOP=1 -v worker_password="'$$WORKER_DB_PASSWORD'" -f /sql/worker-role.sql
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?Set WORKER_DB_PASSWORD in .env}
    volumes:
      - ./infrastructure/database/worker-role.sql:/sql/worker-role.sql:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: "no"

  api:
    build:
      context: ./services/api
      args:
        WITH_BROWSER: ${SENTINEL_WITH_BROWSER:-false}
    environment: *api-environment
    volumes:
      - uploads:/var/lib/sentinel/uploads
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/system/health')"]
      interval: 10s
      retries: 5

  # Scans run here, not in the API process. The worker never executes samples, but it
  # still runs unprivileged, on a read-only filesystem, with capped memory and CPU.
  worker:
    build:
      context: ./services/api
      args:
        WITH_BROWSER: ${SENTINEL_WITH_BROWSER:-false}
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "scans", "--loglevel=INFO", "--concurrency=4", "--max-tasks-per-child=200"]
    environment:
      <<: *api-environment
      # This container parses untrusted files and pages, so it gets only the
      # restricted database role and its own secret: a parser exploit finds no
      # full database credentials and no application secret in its environment.
      SENTINEL_DATABASE_URL: postgresql+psycopg://sentinel_worker:${WORKER_DB_PASSWORD}@postgres:5432/sentinel
      SENTINEL_WORKER_DATABASE_URL: postgresql+psycopg://sentinel_worker:${WORKER_DB_PASSWORD}@postgres:5432/sentinel
      SENTINEL_SECRET_KEY: ${WORKER_SECRET_KEY:?Set WORKER_SECRET_KEY in .env}
      SENTINEL_SMTP_PASSWORD: ""
      SENTINEL_TELEGRAM_BOT_TOKEN: ""
      SENTINEL_WHATSAPP_ACCESS_TOKEN: ""
      SENTINEL_WHATSAPP_APP_SECRET: ""
      SENTINEL_INBOUND_EMAIL_TOKEN: ""
      SENTINEL_HIBP_API_KEY: ""
      SENTINEL_VAPID_PRIVATE_KEY: ""
      SENTINEL_METRICS_TOKEN: ""
      # The headless browser (when enabled) keeps its profile under $HOME.
      HOME: /tmp
    volumes:
      - uploads:/var/lib/sentinel/uploads
    read_only: true
    tmpfs: [/tmp]
    shm_size: 256m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 2
    depends_on:
      worker-role: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  # Feed refresh, retention, webhooks and replies to bots and emails. Has full
  # database access but never touches uploaded samples.
  tasks:
    build: ./services/api
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "tasks", "--loglevel=INFO", "--concurrency=2", "--max-tasks-per-child=500"]
    environment: *api-environment
    volumes:
      - uploads:/var/lib/sentinel/uploads
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  # Hourly feed refresh and retention sweep.
  scheduler:
    build:
      context: ./services/api
      args:
        WITH_BROWSER: ${SENTINEL_WITH_BROWSER:-false}
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    environment: *api-environment
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      redis: { condition: service_healthy }

  web:
    build: ./apps/web
    environment:
      SENTINEL_API_URL: http://api:8000
      NEXT_PUBLIC_CONTACT_URL: ${NEXT_PUBLIC_CONTACT_URL:-}
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      api: { condition: service_healthy }

  caddy:
    image: caddy:2-alpine
    environment:
      SENTINEL_SITE_ADDRESS: ${SENTINEL_SITE_ADDRESS:-:8080}
    ports:
      - "8080:8080"
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [web]

  clamav:
    image: clamav/clamav:stable
    profiles: [clamav]
    mem_limit: 2g

  # Metrics and alert rules. Needs SENTINEL_METRICS_TOKEN in .env. Not published;
  # reach it with `docker compose port prometheus 9090` or an SSH tunnel.
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    secrets:
      - source: metrics-token
        target: /etc/prometheus/metrics-token
    depends_on: [api]

volumes:
  postgres-data:
  uploads:
  caddy-data:
  prometheus-data:

secrets:
  metrics-token:
    environment: SENTINEL_METRICS_TOKEN
