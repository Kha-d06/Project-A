# Scrapes Qalaa's metrics endpoint. Start with:
#   docker compose --profile monitoring up
# The bearer token must match SENTINEL_METRICS_TOKEN; Compose passes it in as a file.
global:
  scrape_interval: 60s

scrape_configs:
  - job_name: sentinel
    metrics_path: /api/v1/system/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: ["api:8000"]

rule_files:
  - /etc/prometheus/alerts.yml

# Firing alerts go to Alertmanager, which forwards them to Qalaa to email admins.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
