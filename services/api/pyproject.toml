[project]
name = "sentinel-api"
version = "0.1.0"
description = "SENTINEL scanning API and background workers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "celery>=5.4",
    "redis>=5.2",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "tldextract>=5.1",
    "zxing-cpp>=2.3",
    "pillow>=11",
    "yara-python>=4.5",
    "oletools>=0.60",
    "pefile>=2024.8",
    "dnspython>=2.7",
    "pyaxmlparser>=0.3.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM"]
ignore = [
    "B008",  # FastAPI's Depends() in argument defaults is the framework's idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S310", "E501"]
"alembic/versions/*" = ["E501"]
# Model prompt text: hard-wrapping would change what the model receives.
"app/ai/explain.py" = ["E501"]
# Bilingual rule text: wrapping Arabic sentences mid-phrase hurts readability for reviewers.
"app/analyzers/message_patterns.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["celery.*", "tldextract.*", "yara", "oletools.*", "pefile", "pyaxmlparser.*", "zxingcpp"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "error::DeprecationWarning:app.*",
    # oletools still calls deprecated pyparsing APIs; not actionable here.
    "ignore::DeprecationWarning:oletools.*",
]
