# Qalaa regression atomics in Atomic Red Team's schema (github.com/redcanaryco/atomic-red-team, MIT).
# The extra `qalaa` block says what the background service must (or must not) report.
attack_technique: T1552.004
display_name: "Unsecured Credentials: Private Keys"
atomic_tests:
  - name: A script keeps an SSH private key open
    auto_generated_guid: 6b1f6c2e-2a51-4d1e-9a51-1b0b6d9e0001
    description: An unexpected program reads ~/.ssh/id_rsa (and holds it, so polling sources see it too).
    supported_platforms: [linux, macos]
    executor:
      name: sh
      command: |
        mkdir -p "$HOME/.ssh" && printf -- '-----BEGIN OPENSSH PRIVATE KEY-----\nfake\n' > "$HOME/.ssh/id_rsa" && chmod 600 "$HOME/.ssh/id_rsa"
        python3 -c "import time,os; f=open(os.path.expanduser('~/.ssh/id_rsa')); time.sleep(#{hold})" &
        echo $! > "$HOME/atomic.pid"
      cleanup_command: |
        kill "$(cat "$HOME/atomic.pid")" 2>/dev/null; rm -f "$HOME/atomic.pid" "$HOME/.ssh/id_rsa"
    input_arguments:
      hold: { description: Seconds the key stays open, type: integer, default: 60 }
    qalaa:
      expect:
        event: alert
        match: { kind: credential, credential: ssh_key, file: "~/.ssh/id_rsa" }
      within_seconds: 45

  - name: A look-alike named "ssh" outside the system folders reads the key
    auto_generated_guid: 6b1f6c2e-2a51-4d1e-9a51-1b0b6d9e0002
    description: A copy of an interpreter named ssh in a writable folder must not borrow ssh's trust.
    supported_platforms: [linux]
    executor:
      name: sh
      command: |
        mkdir -p "$HOME/.ssh" "$HOME/.cache/x" && printf -- '-----BEGIN OPENSSH PRIVATE KEY-----\nfake\n' > "$HOME/.ssh/id_ed25519" && chmod 600 "$HOME/.ssh/id_ed25519"
        cp /bin/sh "$HOME/.cache/x/ssh"
        "$HOME/.cache/x/ssh" -c 'exec 3<"$HOME/.ssh/id_ed25519"; i=0; while [ $i -lt 60 ]; do sleep 1 3<&-; i=$((i+1)); done' &
        echo $! > "$HOME/atomic.pid"
      cleanup_command: |
        kill "$(cat "$HOME/atomic.pid")" 2>/dev/null; rm -rf "$HOME/atomic.pid" "$HOME/.cache/x" "$HOME/.ssh/id_ed25519"
    qalaa:
      expect:
        event: alert
        match: { kind: credential, credential: ssh_key, program: ssh }
      within_seconds: 45

  - name: Reading a public key is not an alert
    auto_generated_guid: 6b1f6c2e-2a51-4d1e-9a51-1b0b6d9e0003
    description: Negative control. id_rsa.pub is public.
    supported_platforms: [linux, macos]
    executor:
      name: sh
      command: |
        mkdir -p "$HOME/.ssh" && echo "ssh-ed25519 AAAA test" > "$HOME/.ssh/id_rsa.pub"
        python3 -c "import time,os; f=open(os.path.expanduser('~/.ssh/id_rsa.pub')); time.sleep(25)" &
        echo $! > "$HOME/atomic.pid"
      cleanup_command: |
        kill "$(cat "$HOME/atomic.pid")" 2>/dev/null; rm -f "$HOME/atomic.pid" "$HOME/.ssh/id_rsa.pub"
    qalaa:
      expect_none:
        event: alert
        match: { kind: credential }
      within_seconds: 20

  - name: A quick copy of a private key (cp)
    auto_generated_guid: 6b1f6c2e-2a51-4d1e-9a51-1b0b6d9e0004
    description: ART's classic "copy private keys". A read that finishes between two polls is only seen with the fanotify on-access helper.
    supported_platforms: [linux, macos]
    executor:
      name: sh
      command: |
        mkdir -p "$HOME/.ssh" && echo key > "$HOME/.ssh/id_quick" && chmod 600 "$HOME/.ssh/id_quick" && cp "$HOME/.ssh/id_quick" "$HOME/stolen"
      cleanup_command: rm -f "$HOME/.ssh/id_quick" "$HOME/stolen"
    qalaa:
      status: gap
      note: Seen only in every-open mode (Linux fanotify helper, root). Polling misses it, as the Credentials page says.
