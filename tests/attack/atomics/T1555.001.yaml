attack_technique: T1555.001
display_name: "Credentials from Password Stores: Keychain"
atomic_tests:
  - name: Dump the keychain with the security tool
    auto_generated_guid: 41a7c0de-3b2f-4f0c-a9a2-0c1d2e3f0001
    description: SigmaHQ proc_creation_macos_security_* shape. A single quick dump between two snapshots is a known polling gap.
    supported_platforms: [macos]
    executor:
      name: sh
      command: |
        # One dump lasts milliseconds; a 15-second process snapshot only catches
        # one running, so it is repeated back to back for a minute.
        ( n=0; end=$((SECONDS + 60)); while [ "$SECONDS" -lt "$end" ]; do /usr/bin/security dump-keychain /Library/Keychains/System.keychain >/dev/null || echo "dump failed ($?)"; n=$((n+1)); done; echo "$n dumps" ) &
        echo $! > "$HOME/atomic.pid"
      cleanup_command: |
        pkill -P "$(cat "$HOME/atomic.pid")" 2>/dev/null; kill "$(cat "$HOME/atomic.pid")" 2>/dev/null; rm -f "$HOME/atomic.pid"
    qalaa:
      expect:
        event: alert
        match: { kind: credential, credential: keychain, severity: high }
      within_seconds: 50
