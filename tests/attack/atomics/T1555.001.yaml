attack_technique: T1555.001
display_name: "Credentials from Password Stores: Keychain"
atomic_tests:
  - name: Dump the keychain with the security tool
    auto_generated_guid: 41a7c0de-3b2f-4f0c-a9a2-0c1d2e3f0001
    description: SigmaHQ proc_creation_macos_security_* shape. Kept running so the 15-second poll sees it.
    supported_platforms: [macos]
    executor:
      name: sh
      command: |
        ( for i in $(seq 1 30); do /usr/bin/security dump-keychain >/dev/null 2>&1; sleep 1; done ) &
        echo $! > "$HOME/atomic.pid"
      cleanup_command: |
        pkill -P "$(cat "$HOME/atomic.pid")" 2>/dev/null; kill "$(cat "$HOME/atomic.pid")" 2>/dev/null; rm -f "$HOME/atomic.pid"
    qalaa:
      expect:
        event: alert
        match: { kind: credential, credential: keychain, severity: high }
      within_seconds: 40
